<section class="hero is-oni">
  <div class="hero-body">
    <div class="container">
      <h1 class="title is-1">
        Technical Blog
      </h1>
      <p class="subtitle is-4">
        Insights, tutorials, and best practices for functional programming
      </p>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="content">
      $for(posts)$
      <article class="box">
        <h2 class="title is-3 post-title">
          <a href="$url$">$title$</a>
        </h2>
        <div class="post-meta">
          <span class="icon-text">
            <span class="icon">
              <i class="far fa-calendar"></i>
            </span>
            <span>$date$</span>
          </span>
          $if(tags)$
          <span style="margin-left: 1rem;">
            $tags$
          </span>
          $endif$
        </div>
      </article>
      $endfor$
    </div>
  </div>
</section>
