$for(posts)$
<article class="box">
  <h3 class="title is-4 post-title">
    <a href="$url$">$title$</a>
  </h3>
  <div class="post-meta">
    <span class="icon-text">
      <span class="icon">
        <i class="far fa-calendar"></i>
      </span>
      <span>$date$</span>
    </span>
  </div>
</article>
$endfor$
